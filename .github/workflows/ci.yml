name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kalyna
          POSTGRES_PASSWORD: kalyna_dev
          POSTGRES_DB: kalyna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kalyna"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql://kalyna:kalyna_dev@localhost:5432/kalyna_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build